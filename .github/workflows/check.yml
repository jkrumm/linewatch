# One package: the API, collector and scripts at the repo root.
#   - `oxfmt --check` (root `bun run format:check`) covers the API, collector and scripts;
#     `.oxfmtrc.json` ignores docs, JSON/YAML and generated files.

name: check
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS, not ubuntu. This is not a preference — AGENTS.md's first line is "Mac mini only", and
  # the collector shells out to `route -n get default`, `ifconfig -m`, `netstat`, `networksetup`
  # and `ipconfig` with no npm deps in between. `collector/vantage.test.ts` stubs `route` through
  # PATH injection but runs the rest for real, so on a Linux runner those parses return null and
  # two tests fail for a reason that says nothing about the code. Seeded as ubuntu and caught on
  # the first CI run, which is the point of having one.
  api:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test ./src ./collector
