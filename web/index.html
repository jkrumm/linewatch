<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDEFF2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#242424" />
    <title>linewatch</title>
    <script>
      // Prevents a flash of the wrong color scheme before Mantine hydrates.
      try {
        var stored = localStorage.getItem('mantine-color-scheme-value')
        document.documentElement.setAttribute('data-mantine-color-scheme', stored || 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
